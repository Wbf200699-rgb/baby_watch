# Install on the public gateway at /etc/nginx/sites-available/renesas.zyxserver.online.
# The gateway and Raspberry Pi must be in the same Tailscale network.
server {
    listen 80;
    listen [::]:80;
    server_name renesas.zyxserver.online;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name renesas.zyxserver.online;

    ssl_certificate /etc/letsencrypt/live/renesas.zyxserver.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/renesas.zyxserver.online/privkey.pem;

    client_max_body_size 1m;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;

    location = /api/v1/device/stream {
        proxy_pass http://100.81.192.84:8088;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }

    location = /api/v1/device/matrices {
        proxy_pass http://100.81.192.84:8088;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    location = /api/v1/media/device/audio {
        proxy_pass http://100.81.192.84:8088;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    location = /api/v1/media/device/video {
        proxy_pass http://100.81.192.84:8088;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    location /api/v1/ {
        proxy_pass http://100.81.192.84:8088;
        include proxy_params;
    }

    location = /health {
        proxy_pass http://100.81.192.84:8088;
        include proxy_params;
    }

    location /api/dashboard/stream {
        auth_basic "Baby Monitor";
        auth_basic_user_file /etc/nginx/.htpasswd-renesas;
        proxy_pass http://100.81.192.84:8088;
        include proxy_params;
        proxy_buffering off;
        proxy_cache off;
    }

    location = /api/dashboard/realtime/ws {
        auth_basic "Baby Monitor";
        auth_basic_user_file /etc/nginx/.htpasswd-renesas;
        proxy_pass http://100.81.192.84:8088;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    location ~ ^/api/dashboard/media/[^/]+/(audio|video)/ws$ {
        auth_basic "Baby Monitor";
        auth_basic_user_file /etc/nginx/.htpasswd-renesas;
        proxy_pass http://100.81.192.84:8088;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    location ~ ^/api/mobile/v1/devices/[^/]+/media/(audio|video)/ws$ {
        auth_basic "Baby Monitor";
        auth_basic_user_file /etc/nginx/.htpasswd-renesas;
        proxy_pass http://100.81.192.84:8088;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    location ~ ^/api/mobile/v1/devices/[^/]+/stream$ {
        auth_basic "Baby Monitor";
        auth_basic_user_file /etc/nginx/.htpasswd-renesas;
        proxy_pass http://100.81.192.84:8088;
        include proxy_params;
        proxy_read_timeout 3600s;
        proxy_buffering off;
        proxy_cache off;
    }

    location / {
        auth_basic "Baby Monitor";
        auth_basic_user_file /etc/nginx/.htpasswd-renesas;
        proxy_pass http://100.81.192.84:8088;
        include proxy_params;
    }
}
