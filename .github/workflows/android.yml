name: Android checks

on:
  push:
    branches: [main, 'agent/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server and protocol checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: baby_monitor/server/requirements.txt
      - name: Install server dependencies
        run: python -m pip install -r baby_monitor/server/requirements.txt
      - name: Test server and protocol contracts
        run: python -m unittest discover -s baby_monitor/server/tests -v
      - name: Test dashboard history
        run: node --test baby_monitor/server/tests/test_telemetry_history.js
      - name: Check dashboard syntax
        run: node --check baby_monitor/server/static/app.js

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Test, lint and build
        run: bash gradlew testDebugUnitTest lintDebug assembleDebug --no-daemon
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: app/build/reports/
          if-no-files-found: ignore
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: baby-watch-debug
          path: app/build/outputs/apk/debug/app-debug.apk
